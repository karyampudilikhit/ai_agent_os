# GitHub-driven deploy to Fly.io. Every push to the deploy branches
# triggers `flyctl deploy --remote-only`. The remote-only flag pushes
# the Docker build to Fly's builders, so this runner doesn't need
# Docker installed.
#
# One-time setup on GitHub:
#   1. `flyctl auth token` (on your laptop) — copies a token to clipboard
#   2. Repo Settings → Secrets and variables → Actions → New secret
#      Name:  FLY_API_TOKEN
#      Value: <paste the token>
#   3. Push to main (or feat/phase-4-orchestration) → Action fires
#
# Manual trigger (Actions tab → Deploy to Fly.io → Run workflow) is also
# wired for on-demand redeploys without a commit.

name: Deploy to Fly.io

on:
  push:
    branches:
      - main
      - feat/phase-4-orchestration
  workflow_dispatch:

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
