# Fly.io config. Rename `app` after `fly apps create <your-name>` —
# the name must be globally unique across Fly's registry.
#
# Region `bom` = Mumbai (closest to Bengaluru / India). If you're not
# in India change to sin/sfo/etc. — `flyctl platform regions` lists all.

app = "neutron-ai"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  # DATA_DIR is set in the Dockerfile; kept here for visibility.
  DATA_DIR = "/data"
  # These get overridden by `fly secrets set` — never commit real values.
  # OLLAMA_HOST  = "https://ollama.com"
  # OLLAMA_API_KEY = "..."
  # SMTP_HOST, SMTP_USER, SMTP_PASS, SMTP_FROM
  # IMAP_HOST, IMAP_USER, IMAP_PASS
  # SLACK_WEBHOOK_URL
  # TAVILY_API_KEY

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Free tier: keep the VM alive so cold starts don't kill investor
  # demos. `auto_stop_machines = "stop"` would save money at the cost
  # of a ~30s wake-up on first hit.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  # Free-tier shared CPU is the "smallest" tier. Bump to
  # shared-cpu-2x once you're getting real traffic.
  size = "shared-cpu-1x"
  # NOT verified under load. A headless Chromium routinely wants
  # 400-700MB on its own, before FastAPI and the Python runtime, so a
  # browser task on 512mb is a plausible OOM-kill. An OOM presents as
  # the machine restarting mid-run rather than as a browser error, so
  # it is easy to misdiagnose as a code bug. Left at 512mb because
  # raising it is a billing decision, not a technical one — but if
  # browser tasks die on the deployed instance while working locally,
  # raise this to 1gb FIRST, before debugging anything in the code.
  memory = "512mb"
