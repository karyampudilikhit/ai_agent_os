<!doctype html>
<html>
<head><title>Vision AI Browser Task Test Form</title></head>
<body>
  <h1>Contact Us</h1>
  <form id="contact-form" onsubmit="document.getElementById('result').innerText='SUBMITTED: ' + new Date().toISOString(); document.title='Submitted OK'; return false;">
    <label for="full_name">Full Name</label>
    <input type="text" id="full_name" name="full_name" placeholder="Jane Doe"><br>

    <label for="email_addr">Email Address</label>
    <input type="email" id="email_addr" name="email_addr" placeholder="jane@example.com"><br>

    <label for="company_name">Company</label>
    <input type="text" id="company_name" name="company_name"><br>

    <label for="inquiry_type">Inquiry Type</label>
    <select id="inquiry_type" name="inquiry_type">
      <option value="">-- choose --</option>
      <option value="sales">Sales question</option>
      <option value="support">Support request</option>
      <option value="partnership">Partnership inquiry</option>
    </select><br>

    <label for="message_body">Message</label>
    <textarea id="message_body" name="message_body" placeholder="How can we help?"></textarea><br>

    <button type="submit">Send Message</button>
    <button type="button" onclick="alert('cancelled')">Cancel</button>
  </form>
  <div id="result"></div>
</body>
</html>
